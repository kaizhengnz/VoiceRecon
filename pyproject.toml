[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "VoiceRecon"
dynamic = ["version"]
description = "Capture microphone + system audio, transcribe locally, optionally send each segment to an AI with a scenario preset."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kaizhengnz", email = "kaizhengnz@gmail.com" }]
keywords = ["speech-to-text", "whisper", "transcription", "meeting", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # Cross-platform audio capture for system-audio loopback. Exposes loopback
    # devices automatically on Windows (WASAPI) and Linux (PulseAudio monitor
    # sources). On macOS the user must install BlackHole and select it as the
    # input; CoreAudio does not expose loopback natively.
    "soundcard>=0.4.3",
    # Mic capture uses PortAudio via sounddevice — soundcard's Windows
    # backend asserts a WAVEFORMATEXTENSIBLE mix format that many consumer
    # mics do not report and crashes the capture thread.
    "sounddevice>=0.5.6",
    # Local STT engine. faster-whisper wraps CTranslate2.
    "faster-whisper>=1.0",
    # Voice activity detection. ONNX runtime, no PyTorch dependency.
    "silero-vad>=5.0",
    # AI delivery.
    "anthropic>=0.104",
    "requests>=2.31",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
voicerecon = "voicerecon.cli:main"

[project.urls]
Homepage = "https://github.com/kaizhengnz/VoiceRecon"
Repository = "https://github.com/kaizhengnz/VoiceRecon"
Issues = "https://github.com/kaizhengnz/VoiceRecon/issues"

[tool.hatch.version]
path = "src/voicerecon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voicerecon"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "scripts", "*.tmp.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",
    "SIM105",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
